name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  RUST_BACKTRACE: '1'

jobs:
  # ---------- 共享核心 + Web ----------
  js:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # postinstall 会把 @ffmpeg/core 复制到 apps/web/public/ffmpeg
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm -r typecheck

      - name: ESLint
        run: pnpm lint

      - name: 格式检查
        run: pnpm format:check

      - name: 依赖安全检查
        run: pnpm audit --registry https://registry.npmjs.org --prod --audit-level high

      - name: 安装原生集成测试所需的 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: 单元测试（shared + web）
        run: pnpm test

      - name: 覆盖率
        run: pnpm test:coverage

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage
          path: |
            packages/shared/coverage/lcov.info
            apps/web/coverage/lcov.info
          retention-days: 7

      - name: 构建 Web
        run: pnpm build:web:release

      - name: 上传 Web 产物
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  # ---------- Windows 桌面（Tauri 2 + Rust） ----------
  desktop:
    name: Windows 桌面
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Rust 格式检查
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 部分测试会真实调用 ffmpeg，runner 缺失时自动安装
      - name: 确保 FFmpeg 可用
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path', 'User')
          }
          ffmpeg -version | Select-Object -First 1

      - name: Rust 测试
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: 构建前端（桌面模式）
        run: pnpm build:desktop-ui

      - name: 打包桌面版（MSI + NSIS）
        shell: pwsh
        run: |
          # CI 只验证安装包可构建；正式 Release 始终启用签名更新包。
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri-ci.json'
          @{ bundle = @{ createUpdaterArtifacts = $false } } | ConvertTo-Json -Depth 3 | Set-Content -Path $configPath -Encoding utf8
          pnpm --filter @audio-studio/desktop exec tauri build --config $configPath

      - name: 上传安装包
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-bundles
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: 安装、启动和卸载 NSIS 安装包
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe -File
          if (@($installer).Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/smoke-windows-installer.ps1 -Installer $installer.FullName -Version $version
