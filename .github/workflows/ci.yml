name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  RUST_BACKTRACE: '1'

jobs:
  # ---------- 共享核心 + Web ----------
  js:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # postinstall 会把 @ffmpeg/core 复制到 apps/web/public/ffmpeg
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm -r typecheck

      - name: ESLint
        run: pnpm lint

      - name: 格式检查
        run: pnpm format:check

      - name: 单元测试（shared + web）
        run: pnpm test

      - name: 覆盖率
        run: pnpm test:coverage

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: |
            packages/shared/coverage/lcov.info
            apps/web/coverage/lcov.info
          retention-days: 7

      - name: 构建 Web
        run: pnpm build:web

      - name: 上传 Web 产物
        uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  # ---------- Windows 桌面（Tauri 2 + Rust） ----------
  desktop:
    name: Windows 桌面
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Rust 格式检查
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 部分测试会真实调用 ffmpeg，runner 缺失时自动安装
      - name: 确保 FFmpeg 可用
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path', 'User')
          }
          ffmpeg -version | Select-Object -First 1

      - name: Rust 测试
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: 构建前端（桌面模式）
        run: pnpm build:desktop-ui

      - name: 打包桌面版（MSI + NSIS）
        run: pnpm --filter @audio-studio/desktop build

      - name: 上传安装包
        uses: actions/upload-artifact@v5
        with:
          name: desktop-bundles
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  # ---------- Android ----------
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 直接用 runner 预装的 SDK：android-actions/setup-android 在
      # cmdline-tools 版本校验 + 许可证步骤上会以 exit 1 失败
      - name: 安装 SDK 组件
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          fi
          echo "使用 sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "build-tools;36.0.0"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Android Lint
        working-directory: apps/android
        run: ./gradlew lintDebug --no-daemon

      - name: 构建 Debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          if-no-files-found: error
          retention-days: 7
          path: apps/android/app/build/outputs/apk/debug/*.apk
