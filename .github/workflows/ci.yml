name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  RUST_BACKTRACE: '1'

jobs:
  # ---------- 共享核心 + Web ----------
  js:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # postinstall 会把 @ffmpeg/core 复制到 apps/web/public/ffmpeg
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm -r typecheck

      - name: 单元测试（shared + web）
        run: pnpm test

      - name: 构建 Web
        run: pnpm build:web

      - name: 上传 Web 产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  # ---------- Windows 桌面（Tauri 2 + Rust） ----------
  desktop:
    name: Windows 桌面
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 部分测试会真实调用 ffmpeg，runner 缺失时自动安装
      - name: 确保 FFmpeg 可用
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path', 'User')
          }
          ffmpeg -version | Select-Object -First 1

      - name: Rust 测试
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: 构建前端（桌面模式）
        run: pnpm build:desktop-ui

      - name: 打包桌面版（MSI + NSIS）
        run: pnpm --filter @audio-studio/desktop build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundles
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  # ---------- Android ----------
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 构建 Debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          retention-days: 7
          path: apps/android/app/build/outputs/apk/debug/*.apk
